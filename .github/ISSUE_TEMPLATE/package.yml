name: Submit or update a package
description: Register a package by its public source; presentation comes from denova-pack.json.
title: "[Package] "
body:
  - type: input
    id: source
    attributes:
      label: Public package source
      description: Provide the GitHub repository URL, Git ref and package directory. Keep names, descriptions and usage in that directory's denova-pack.json.
      placeholder: https://github.com/author/resources · main · writing-kit
    validations:
      required: true
  - type: input
    id: manifest
    attributes:
      label: Manifest URL for ZIP sources only
      description: If the source is a ZIP URL, link to a public copy of the same denova-pack.json included in the archive. GitHub sources need no additional URL.
  - type: textarea
    id: notes
    attributes:
      label: Optional registration notes
      description: Describe a source correction or anything the maintainer should check. Package ID, author, resource types and presentation are read from the manifest.
