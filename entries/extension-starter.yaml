  zh-CN: 需要 Denova 扩展 API v1。统计工具需要 Node.js；游戏需要配置文本模型并授权角色会话与实例存档。界面为虚构社交游戏。
  en-US: Requires Denova extension API v1. Statistics needs Node.js; the fictional social game needs a text model, Agent sessions and instance storage permissions.
