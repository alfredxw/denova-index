<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lantern crossing</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game-root" aria-busy="true">
  <header><span id="eyebrow"></span><button id="exit" type="button" hidden></button></header>
  <h1 id="title"></h1><p id="subtitle"></p>
  <article><span id="chapter"></span><h2 id="scene-title" tabindex="-1"></h2><p id="scene-text"></p><div id="choices"></div></article>

</main><script type="module" src="game.mjs"></script></body></html>
